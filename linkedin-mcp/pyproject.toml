[project]
name = "linkedin-mcp"
version = "0.1.0"
description = "Read-only MCP server over your own LinkedIn data export."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
linkedin-mcp = "linkedin_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkedin_mcp"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
